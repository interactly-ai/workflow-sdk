[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interactly-configs"
version = "0.1.0"
description = "Pure-Pydantic typed config classes for authoring Interactly workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["interactly", "workflow", "ai", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/interactly/interactly-python"
Documentation = "https://docs.interactly.io/sdk/configs"
Repository = "https://github.com/interactly/interactly-configs"

[tool.hatch.build.targets.wheel]
packages = ["src/interactly_configs"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
