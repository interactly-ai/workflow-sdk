[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interactly-configs"
# Read from src/interactly_configs/_version.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "Pure-Pydantic typed config classes for authoring Interactly workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["interactly", "workflow", "ai", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/interactly/interactly-python"
Documentation = "https://docs.interactly.io/sdk/configs"
Repository = "https://github.com/interactly/interactly-configs"

[tool.hatch.version]
path = "src/interactly_configs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/interactly_configs"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# THIS SECTION IS LOAD-BEARING. `configs/` is its own ruff settings root, so it does NOT inherit the
# root pyproject's ruleset. Without an explicit `select` here, ruff falls back to a much broader
# default and `ruff check configs/ --fix` rewrites every `Optional[X]` into `X | None`.
#
# That is not cosmetic. `src/interactly_configs/` is a deliberate mirror of
# `agentic_workflow_framework/configs/`, which uses typing-module style, and `make parity-check`
# compares the two. Running that fix once took the parity report from 0 differences to 1194 — the
# mirror stops being diffable against upstream, which is the whole point of vendoring it this way.
#
# `UP` (pyupgrade) is therefore deliberately NOT selected, matching the root pyproject. Re-enable
# only if upstream itself moves to PEP 604/585 annotations.
select = ["E", "F", "W", "I", "N"]
ignore = [
    "E501",  # Line length handled by the formatter
    # `createdBy`, `updatedBy`, `createdAt`, `updatedAt` are WIRE FIELD NAMES: the server serializes
    # them in exactly this camelCase. Renaming them to satisfy the convention would silently change
    # the payload and break round-tripping, so the mirror keeps upstream's spelling.
    "N815",
    # `__init__.py` imports `workflow_run` and `get_node_config_class` *after* the
    # `SuperNodeConfig.model_rebuild()` call, because the rebuild must run before those modules
    # resolve their forward references. The order is deliberate and load-bearing.
    "E402",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
